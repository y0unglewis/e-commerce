# Tạm dùng để sinh file Gradle Wrapper chuẩn trên runner, xóa sau khi lấy binary.
name: Generate wrapper bootstrap
on:
    push:
        branches: [feature/gearhub-foundation]
jobs:
    wrapper:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
            - uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: '8.9'
            - name: Generate official wrapper
              run: |
                  mkdir -p wrapper-temp
                  cd wrapper-temp
                  touch settings.gradle
                  gradle wrapper --gradle-version 8.9
            - name: Print binary for repository bootstrap
              run: |
                  echo GEARHUB_WRAPPER_BASE64_START
                  base64 -w0 wrapper-temp/gradle/wrapper/gradle-wrapper.jar
                  echo
                  echo GEARHUB_WRAPPER_BASE64_END
